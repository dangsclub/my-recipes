<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍳 댕스의 나만의 야식 레시피북</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #fcf8f2;
            color: #3e2723;
            margin: 0;
            padding: 30px 15px;
        }
        .header-title {
            text-align: center;
            color: #d84315;
            font-size: 32px;
            margin-bottom: 5px;
        }
        .header-subtitle {
            text-align: center;
            color: #795548;
            margin-bottom: 40px;
            font-size: 16px;
        }
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .recipe-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(121, 85, 72, 0.15);
            border: 1px solid #efebe9;
        }
        .recipe-name {
            font-size: 20px;
            color: #d84315;
            border-bottom: 2px solid #ffccbc;
            padding-bottom: 8px;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .recipe-detail {
            line-height: 1.6;
            font-size: 14px;
            color: #4e342e;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1 class="header-title">🌙 나만의 야식 레시피북</h1>
    <p class="header-subtitle">내가 좋아하는 야식들의 레시피를 보관하고 확인하는 대시보드입니다.</p>
    
    <div class="recipe-grid" id="recipe-list">
        <!-- API 동적 로드 영역 -->
        <div style="grid-column: 1 / -1; text-align: center; color: #795548;">레시피북 목록을 실시간으로 가져오는 중...</div>
    </div>

    <script>
        async function fetchMyRecipes() {
            try {
                const response = await fetch('https://api.github.com/repos/dangsclub/my-recipes/contents');
                if (!response.ok) throw new Error('불러오기 실패');
                const files = await response.json();
                
                // markdown 파일 필터링
                const mdFiles = files.filter(f => f.name.endsWith('.md') && f.name !== 'README.md');
                const container = document.getElementById('recipe-list');
                container.innerHTML = '';
                
                for (const file of mdFiles) {
                    const fileResp = await fetch(file.url);
                    const fileData = await fileResp.json();
                    const content = decodeURIComponent(atob(fileData.content).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    
                    const card = document.createElement('div');
                    card.className = 'recipe-card';
                    
                    let title = file.name.replace('.md', '');
                    const lines = content.split('
');
                    if (lines[0].startsWith('# ')) {
                        title = lines[0].replace('# ', '');
                    }
                    
                    card.innerHTML = `
                        <div class="recipe-name">✨ ${title}</div>
                        <div class="recipe-detail">${content.replace(lines[0], '').trim()}</div>
                    `;
                    container.appendChild(card);
                }
            } catch (err) {
                document.getElementById('recipe-list').innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: red;">레시피 데이터를 불러올 수 없습니다.</div>';
            }
        }
        fetchMyRecipes();
    </script>
</body>
</html>
