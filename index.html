<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 댕스클럽 야식 레시피 허브</title>
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #0b0f19;
            color: #f1f5f9;
            margin: 0;
            padding: 30px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 35px;
            padding-bottom: 10px;
        }
        h1 {
            color: #fbbf24;
            font-size: 36px;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 16px;
            margin: 0;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }
        .kpi-card {
            background: #141b2d;
            border: 1px solid #1f293d;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .kpi-value {
            font-size: 32px;
            font-weight: 800; 
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .kpi-label {
            font-size: 13px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }
        .recipe-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.25s, border-color 0.25s;
        }
        .recipe-card:hover {
            transform: translateY(-4px);
            border-color: #3b82f6;
        }
        .recipe-title {
            font-size: 20px;
            font-weight: 800;
            color: #fbbf24;
            margin: 0 0 16px 0;
            border-bottom: 2px solid #1f2937;
            padding-bottom: 12px;
        }
        .recipe-body {
            color: #cbd5e1;
            line-height: 1.7;
            font-size: 14.5px;
            white-space: pre-wrap;
        }
        footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid #1e293b;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌙 댕스클럽 야식 레시피 허브</h1>
            <p class="subtitle">저장소에 보관된 고품격 야식 컬렉션을 실시간으로 모니터링합니다.</p>
        </header>

        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-value" id="kpi-total">-</div>
                <div class="kpi-label">연동 레시피 개수</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value" style="color: #10b981;">ONLINE</div>
                <div class="kpi-label">레시피 서버 상태</div>
            </div>
        </div>

        <div class="recipe-grid" id="recipe-container">
            <div style="grid-column: 1 / -1; text-align: center; color: #94a3b8; padding: 40px;">
                레시피 데이터를 불러오는 중...
            </div>
        </div>

        <footer>
            <p>© dangsclub/my-recipes. All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        async function fetchRecipes() {
            try {
                const response = await fetch('https://api.github.com/repos/dangsclub/my-recipes/contents');
                if (!response.ok) throw new Error('불러오기 실패');
                const files = await response.json();
                const mdFiles = files.filter(f => f.name.endsWith('.md') && f.name !== 'README.md');
                
                document.getElementById('kpi-total').innerText = mdFiles.length + '개';
                const container = document.getElementById('recipe-container');
                container.innerHTML = '';
                
                for (const file of mdFiles) {
                    const fileResp = await fetch(file.url);
                    const fileData = await fileResp.json();
                    const content = decodeURIComponent(atob(fileData.content).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    
                    const card = document.createElement('div');
                    card.className = 'recipe-card';
                    
                    let cleanTitle = file.name.replace('.md', '');
                    const firstLine = content.split('
')[0];
                    if (firstLine.startsWith('# ')) {
                        cleanTitle = firstLine.replace('# ', '');
                    }
                    
                    card.innerHTML = `
                        <div class="recipe-title">🍳 ${cleanTitle}</div>
                        <div class="recipe-body">${content.replace(firstLine, '').trim()}</div>
                    `;
                    container.appendChild(card);
                }
            } catch (err) {
                document.getElementById('recipe-container').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#ef4444;">데이터 로드 중 에러가 발생했습니다.</div>';
            }
        }
        fetchRecipes();
    </script>
</body>
</html>
